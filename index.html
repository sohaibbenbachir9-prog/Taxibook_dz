<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A3A">
<title>taxibook dz</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5EF;--card:#fff;--ink:#14201B;--mute:#67726C;--line:#E2E0D4;--g:#0E5A3A;--gt:#fff;--y:#F4B400;--yt:#1b1500;--ok:#17803d;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0E1411;--card:#17211C;--ink:#ECF1EE;--mute:#9AA7A0;--line:#2A3831;--g:#3DBE86;--gt:#06180f;--ok:#4cd07f;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0)}
.app{max-width:480px;margin:0 auto;padding:0 16px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px}
.brand{font-weight:800;font-size:22px}.brand b{background:var(--y);color:var(--yt);padding:0 8px;border-radius:6px;margin-inline-start:6px;font-size:15px}
h2{font-size:21px;margin:10px 0 4px}h3{font-size:17px;margin:18px 0 6px}
.sub,.note{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:16px;background:var(--y);color:var(--yt);cursor:pointer;margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.sm{width:auto;padding:7px 14px;font-size:14px;margin:6px 6px 0 0}
.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line)}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.price{font-weight:800;color:var(--g)}
input[type=radio]{width:auto;margin-inline-end:8px}details summary{cursor:pointer;font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}
.trip{cursor:pointer}.time{font-size:22px;font-weight:800}
.step{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;margin:10px auto;width:fit-content}
.code{font-weight:800;letter-spacing:1px;direction:ltr;text-align:center;font-size:18px}
.res{border-radius:12px;padding:12px;font-weight:600;margin-top:10px}
.res.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.res.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:8px 2px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--g);font-weight:800}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;display:none;max-width:90%}
</style>
</head>
<body>
<div class="app"><header><div class="brand">taxibook<b>dz</b> <small style="font-size:11px;color:var(--mute);font-weight:600">v5</small></div><span class="tag" id="who"></span></header><main id="v"></main></div>
<nav id="nav"></nav><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const sb=supabase.createClient('https://coxfvgybxdatlmgrpdpr.supabase.co','sb_publishable_y4x1o0QH64FaddlSh8nM0w_7IL1gGbA');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WIL=['الجزائر','وهران','قسنطينة','عنابة','سطيف','البليدة','المدية','تيبازة','بومرداس','تيزي وزو','بجاية','البويرة','الجلفة','الشلف','تلمسان','سيدي بلعباس','غليزان','معسكر','مستغانم','باتنة','بسكرة','ورقلة','غرداية','الأغواط','تيارت','جيجل','سكيكدة','عين الدفلى','برج بوعريريج','المسيلة'];
const EM={'invalid or expired code':'الرمز غير صحيح أو منتهي.','vehicle too small':'مركبتك لا تتسع لركاب هذه الرحلة.','same driver':'هذه رحلتك أصلاً.','nothing due':'لا مستحقات جاهزة.','no requests':'لم تعد هذه الطلبات متاحة (قبلها سائق آخر).','invalid time':'اختر موعداً في المستقبل.','invalid route':'حدّد وجهة صحيحة.','driver not approved':'حساب السائق غير معتمد بعد.','seats exceed vehicle capacity':'عدد المقاعد يتجاوز مقاعد مركبتك.','not enough seats':'لا توجد مقاعد كافية.','trip unavailable':'الرحلة غير متاحة.','invalid drop-off':'محطة النزول غير صحيحة.','invalid ccp':'رقم CCP غير صحيح.','forbidden':'غير مسموح لك بهذا الإجراء.','not your trip':'هذه التذكرة ليست لرحلتك.','Invalid login':'الهاتف أو كلمة السر غير صحيحة.','already registered':'هذا الرقم مسجّل من قبل.','Email not confirmed':'يجب إيقاف تأكيد البريد في إعدادات Supabase.'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3500)};
const err=e=>{const m=(e&&e.message)||String(e);const k=Object.keys(EM).find(k=>m.includes(k));toast(k?EM[k]:m)};
const fmt=d=>new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Algiers',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const V=h=>{$('#v').innerHTML=h;scrollTo(0,0)};
const tomorrow=()=>new Date(Date.now()+864e5).toISOString().slice(0,10);
const wl='<datalist id="w">'+WIL.map(w=>`<option value="${w}">`).join('')+'</datalist>';
let U=null,P=null,DRV=null,tab='';
const TABS={passenger:[['s','بحث','🔍'],['b','حجوزاتي','🎫'],['n','إشعارات','🔔'],['a','حسابي','👤']],driver:[['t','رحلاتي','🚕'],['k','مسح','✅'],['n','إشعارات','🔔'],['a','حسابي','👤']],admin:[['d','السائقون','🪪'],['c','الشكاوى','📨'],['m','المستحقات','💰'],['x','أرقام','📊'],['n','إشعارات','🔔'],['a','حسابي','👤']]};
const HOME={passenger:'s',driver:'t',admin:'d'};
const VIEWS={s:vSearch,b:vBook,n:vNotif,a:vAcct,t:vTrips,k:vScan,d:vDrivers,x:vStats,c:vCases,m:vDues};
const busy=async(b,f)=>{b.disabled=true;try{await f()}catch(e){err(e)}b.disabled=false};

/* ---------- الدخول ---------- */
const mail=p=>p.replace(/\D/g,'')+'@taxibook.dz';
function authView(mode){mode=mode||'login';const reg=mode==='reg';
  V(`<h2>${reg?'إنشاء حساب':'تسجيل الدخول'}</h2><p class="sub">أهلاً بك في taxibook dz</p><div class="card">${reg?'<label>الاسم الكامل</label><input id="n" autocomplete="name">':''}<label>رقم الهاتف</label><input id="p" inputmode="tel" dir="ltr" placeholder="0550123456"><label>كلمة السر (6 أحرف على الأقل)</label><input id="w2" type="password"><div class="err" id="e"></div><button class="btn" id="go">${reg?'إنشاء الحساب':'دخول'}</button></div><button class="btn ghost" id="sw">${reg?'لدي حساب':'إنشاء حساب جديد'}</button>`);
  $('#sw').onclick=()=>authView(reg?'login':'reg');
  $('#go').onclick=e=>busy(e.target,async()=>{const ph=$('#p').value.replace(/\s/g,''),pw=$('#w2').value,E=$('#e');
    if(!/^0[567]\d{8}$/.test(ph))return E.textContent='رقم الهاتف غير صحيح (مثال: 0550123456).';
    if(pw.length<6)return E.textContent='كلمة السر قصيرة.';
    if(reg){const n=$('#n').value.trim();if(n.length<3)return E.textContent='أدخل اسمك الكامل.';
      const {data,error}=await sb.auth.signUp({email:mail(ph),password:pw,options:{data:{full_name:n,phone:ph}}});
      if(error)return err(error);if(!data.session)return E.textContent='تم إنشاء الحساب لكن تأكيد البريد مفعّل في Supabase. أوقفه ثم سجّل الدخول.'}
    else{const {error}=await sb.auth.signInWithPassword({email:mail(ph),password:pw});if(error)return err(error)}
    await boot()})}
async function load(){const a=await sb.from('profiles').select('*').eq('id',U.id).maybeSingle(),b=await sb.from('drivers').select('*').eq('id',U.id).maybeSingle();P=a.data;DRV=b.data}
async function boot(){const {data}=await sb.auth.getSession();U=data.session&&data.session.user;
  if(!U){P=null;$('#nav').innerHTML='';$('#who').textContent='';return authView()}
  await load();if(!P){V('<h2>تعذّر تحميل الحساب</h2><p class="sub">تأكد من تشغيل ملف التحديث في Supabase ثم سجّل الخروج وأعد المحاولة.</p><button class="btn ghost" id="lo">تسجيل الخروج</button>');$('#lo').onclick=out;return}
  if(!(TABS[P.role]||[]).some(x=>x[0]===tab))tab=HOME[P.role];
  $('#who').textContent=P.full_name;nav();show()}
const out=async()=>{await sb.auth.signOut();tab='';boot()};
function nav(){$('#nav').innerHTML=TABS[P.role].map(x=>`<button data-t="${x[0]}" class="${tab===x[0]?'on':''}"><span>${x[2]}</span>${x[1]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{tab=b.dataset.t;if(tab==='a'){await load();}nav();show()})}
function show(){(VIEWS[tab]||vSearch)()}

/* ---------- الراكب ---------- */
function vSearch(){V(`<h2>إلى أين تسافر؟</h2><p class="sub">ابحث عن رحلة. وإن لم تجد، اطلب رحلة وسيصل طلبك للسائقين المتاحين.</p>${wl}<div class="card"><label>من</label><input id="f" list="w" value="الجزائر"><label>إلى (وجهة أو محطة في الطريق)</label><input id="t" list="w" placeholder="المدية"><label>التاريخ</label><input id="d" type="date" value="${tomorrow()}"><button class="btn" id="go">ابحث عن رحلة</button></div><div id="r"></div><h3>طلباتي</h3><div id="mq"><p class="sub">جاري التحميل…</p></div>`);
  $('#go').onclick=e=>busy(e.target,async()=>{const f=$('#f').value.trim(),t=$('#t').value.trim(),d=$('#d').value;if(!t)return toast('اكتب الوجهة.');
    const {data,error}=await sb.rpc('search_trips',{p_from:f,p_to:t,p_date:d});if(error)return err(error);
    $('#r').innerHTML=(data.length?data.map((x,i)=>`<div class="card trip" data-i="${i}"><div class="row"><span class="time">${fmt(x.departs_at).split(' ')[1]}</span><span class="price">${x.price} دج</span></div><b>${esc(x.driver.name)}</b> <span class="note">${esc(x.driver.car)} ${esc(x.driver.color||'')} · ⭐ ${x.driver.rating||'—'}</span><div class="note">💺 ${x.seats_left} متبقية${x.stops.length?' · تمر بـ '+x.stops.map(esc).join('، '):''}</div></div>`).join(''):'<p class="sub">لا توجد رحلات لهذا المسار والتاريخ بعد.</p>')+`<div class="card"><b>${data.length?'لا يناسبك موعد؟':'اطلب رحلة'}</b><p class="note">يصل طلبك للسائقين المتاحين، وعند قبول أحدهم تصير الرحلة رسمية وتدفع لتثبيت مقعدك.</p><label>عدد المقاعد</label><input id="rs" type="number" min="1" max="8" value="1"><button class="btn" id="rq">اطلب رحلة إلى ${esc(t)}</button></div>`;
    $('#r').querySelectorAll('.trip').forEach(c=>c.onclick=()=>vTrip(data[c.dataset.i]));
    $('#rq').onclick=ev=>busy(ev.target,async()=>{const r=await sb.rpc('create_ride_request',{p_from:f,p_to:t,p_date:d,p_seats:+$('#rs').value||1});if(r.error)return err(r.error);
      toast(r.data.existing?'لديك طلب مماثل بانتظار سائق.':'تم إرسال طلبك. عدد السائقين المتاحين الذين أُشعروا: '+r.data.drivers);mine()})});
  async function mine(){const {data,error}=await sb.from('ride_requests').select('*').eq('passenger_id',U.id).order('created_at',{ascending:false}).limit(10);if(error)return err(error);
    const SN={open:'بانتظار سائق',matched:'قبل سائق: ادفع لتثبيت مقعدك',cancelled:'ملغى'};
    $('#mq').innerHTML=data.length?data.map((r,i)=>`<div class="card"><div class="row"><b>${esc(r.from_wilaya)} ← ${esc(r.to_place)}</b><span class="tag ${r.status==='matched'?'ok':''}">${SN[r.status]}</span></div><div class="note">${r.travel_date} · ${r.seats} مقعد</div>${r.status==='matched'?`<button class="btn sm" data-m="${i}">احجز وادفع</button>`:''}${r.status==='open'?`<button class="btn ghost sm" data-c="${i}">إلغاء الطلب</button>`:''}</div>`).join(''):'<p class="sub">لا توجد طلبات.</p>';
    $('#mq').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>busy(b,async()=>{const r=await sb.rpc('get_trip',{p_trip:data[b.dataset.m].trip_id});if(r.error)return err(r.error);if(!r.data)return toast('الرحلة لم تعد متاحة.');vTrip(r.data)}));
    $('#mq').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>busy(b,async()=>{const {error}=await sb.from('ride_requests').update({status:'cancelled'}).eq('id',data[b.dataset.c].id);if(error)return err(error);mine()}))}
  mine()}
function vTrip(t){let n=1;const opts=t.stops.concat([t.to]);
  V(`<h2>${esc(t.from)} ← ${esc(t.to)}</h2><p class="sub">${fmt(t.departs_at)} · ${esc(t.driver.name)} · نقطة التجمع: ${esc(t.meeting_point||'يحددها السائق')}</p><div class="card"><label>محطة النزول (السعر ثابت)</label><select id="dp">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select><label>عدد المقاعد</label><div class="step"><button id="m">−</button><b id="c">1</b><button id="p">+</button></div><div class="row"><b>المجموع</b><b class="price" id="tot"></b></div></div><button class="btn" id="nx">التالي: الدفع</button><button class="btn ghost" id="bk">رجوع</button>`);
  const u=()=>{$('#c').textContent=n;$('#tot').textContent=n*t.price+' دج'};u();$('#bk').onclick=vSearch;
  $('#m').onclick=()=>{if(n>1){n--;u()}};$('#p').onclick=()=>{if(n<t.seats_left){n++;u()}};
  $('#nx').onclick=()=>vPay(t,n,$('#dp').value)}
function vPay(t,n,drop){const tot=n*t.price;
  V(`<h2>الدفع</h2><div class="card"><div class="row"><span>${esc(t.from)} ← ${esc(t.to)}</span><span>${fmt(t.departs_at)}</span></div><div class="row"><span>النزول في</span><b>${esc(drop)}</b></div><div class="row"><span>${n} مقعد × ${t.price} دج</span><b class="price">${tot} دج</b></div></div><h3>طريقة الدفع</h3><label class="card"><input type="radio" name="pm" checked> الذهبية (بريد الجزائر)</label><label class="card"><input type="radio" name="pm"> بطاقة CIB</label><div class="card"><label>رقم البطاقة</label><input id="cn" inputmode="numeric" dir="ltr" placeholder="0000 0000 0000 0000"><p class="note">وضع تجريبي: لا يُسحب أي مال ولا تُحفظ بيانات البطاقة. في النسخة الحقيقية تُحوَّل إلى صفحة الدفع الرسمية.</p></div><div class="err" id="e"></div><button class="btn" id="pay">ادفع ${tot} دج</button><button class="btn ghost" id="bk">رجوع</button>`);
  $('#bk').onclick=()=>vTrip(t);
  $('#pay').onclick=e=>busy(e.target,async()=>{if($('#cn').value.replace(/\D/g,'').length<12)return $('#e').textContent='أدخل رقم بطاقة (للتجربة: أي 16 رقماً).';
    const s=await sb.rpc('start_checkout',{p_trip:t.id,p_seats:n,p_drop:drop});if(s.error)return err(s.error);
    const r=await sb.rpc('dev_confirm_payment',{p_session:s.data.id});if(r.error)return err(r.error);
    if(r.data.result==='confirmed')vTicket(r.data.ticket,true);else{V('<h2>امتلأت الرحلة</h2><p class="sub">سيُسترجع مبلغك. اختر رحلة أخرى.</p><button class="btn" id="b2">رجوع للبحث</button>');$('#b2').onclick=vSearch}})}
function vTicket(code,fresh){V(`<h2>${fresh?'تم الحجز ✓':'تذكرتك'}</h2><p class="sub">أظهر الرمز للسائق عند الصعود.</p><div class="card"><div class="qr" id="q"></div><div class="code">${esc(code)}</div></div><button class="btn ghost" id="bk">رجوع</button>`);
  try{new QRCode($('#q'),{text:code,width:180,height:180})}catch(e){}$('#bk').onclick=()=>{tab='b';nav();vBook()}}
async function vBook(){V('<h2>حجوزاتي</h2><p class="sub">جاري التحميل…</p>');
  const {data,error}=await sb.from('bookings').select('id,ticket_code,seats,drop_off,status,total_price,trips(from_wilaya,to_wilaya,departs_at),reviews(rating)').order('created_at',{ascending:false});if(error)return err(error);
  const ST={paid:'مدفوعة',used:'مستعملة',refund_due:'استرجاع قيد المعالجة',refunded:'مُسترجعة'};
  V('<h2>حجوزاتي</h2>'+(data.length?data.map((b,i)=>`<div class="card"><div class="row"><b>${esc(b.trips.from_wilaya)} ← ${esc(b.trips.to_wilaya)}</b><span class="tag ${b.status==='paid'?'ok':''}">${ST[b.status]}</span></div><div class="note">${fmt(b.trips.departs_at)} · نزول: ${esc(b.drop_off)} · ${b.seats} مقعد · ${b.total_price} دج</div><button class="btn sm" data-i="${i}">عرض التذكرة</button>${b.status==='used'?((Array.isArray(b.reviews)?b.reviews[0]:b.reviews)?'<div class="note">تقييمك: '+'★'.repeat((Array.isArray(b.reviews)?b.reviews[0]:b.reviews).rating)+'</div>':`<div class="row"><select id="rt${i}" style="width:70px"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button class="btn sm" data-r="${i}">قيّم السائق</button></div>`):''}</div>`).join(''):'<p class="sub">لا توجد حجوزات بعد.</p>'));
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>vTicket(data[b.dataset.i].ticket_code));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>busy(b,async()=>{const i=b.dataset.r,{error}=await sb.rpc('rate_booking',{p_booking:data[i].id,p_rating:+$('#rt'+i).value,p_note:null});if(error)return err(error);toast('شكراً لتقييمك');vBook()}))}
async function vNotif(){const {data,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);if(error)return err(error);
  V('<h2>الإشعارات</h2>'+(data.length?data.map(n=>`<div class="card"><b>${esc(n.title)}</b><div class="note">${esc(n.body||'')} · ${fmt(n.created_at)}</div></div>`).join(''):'<p class="sub">لا توجد إشعارات.</p>'));
  const un=data.filter(n=>!n.is_read).map(n=>n.id);if(un.length)sb.from('notifications').update({is_read:true}).in('id',un)}

/* ---------- الحساب + طلب السائق ---------- */
function vAcct(){const roleN={passenger:'راكب',driver:'سائق',admin:'مدير'}[P.role];
  let h=`<h2>حسابي</h2><div class="card"><div class="row"><span>الاسم</span><b>${esc(P.full_name)}</b></div><div class="row"><span>الهاتف</span><b dir="ltr">${esc(P.phone||'')}</b></div><div class="row"><span>الدور</span><span class="tag ok">${roleN}</span></div></div>`;
  const F=[['i','رقم الهوية'],['l','رقم رخصة السياقة'],['m','نوع وطراز المركبة'],['c','اللون'],['r','رقم التسجيل'],['s','عدد المقاعد (1-8)'],['k','رقم حساب CCP لاستلام المستحقات']];
  if(P.role==='passenger'){
    if(DRV&&DRV.status==='pending')h+='<div class="card"><span class="tag">طلب السائق قيد المراجعة</span><p class="note">ستصلك رسالة عند قرار الإدارة، ثم اضغط «تحديث».</p></div>';
    else{if(DRV&&DRV.status==='rejected')h+=`<div class="res bad">رُفض طلبك: ${esc(DRV.reject_reason||'وثائق غير كاملة')}. عدّل بياناتك وأرسل من جديد.</div>`;
      h+=`<h3>التسجيل كسائق</h3><div class="card">${F.map(f=>`<label>${f[1]}</label><input id="a${f[0]}">`).join('')}<label>صورة الهوية</label><input type="file" id="fid" accept="image/*"><label>صورة رخصة السياقة</label><input type="file" id="fl" accept="image/*"><label>صورة بطاقة المركبة</label><input type="file" id="fc" accept="image/*"><p class="note">رقم CCP والوثائق يراها المدير فقط.</p><div class="err" id="e"></div><button class="btn" id="ap">إرسال الطلب للإدارة</button></div>`}}
  V(h+CASEFORM+'<button class="btn ghost" id="rf">تحديث</button><button class="btn ghost" id="lo">تسجيل الخروج</button>');
  $('#lo').onclick=out;$('#rf').onclick=()=>boot();
  $('#cs').onclick=e=>busy(e.target,async()=>{const o=$('#cc').selectedOptions[0];const {error}=await sb.from('cases').insert({author_id:U.id,kind:o.dataset.k,category:o.textContent,body:$('#cb').value.trim()||null});if(error)return err(error);$('#cb').value='';toast('تم إرسالها للإدارة')});
  if($('#ap'))$('#ap').onclick=e=>busy(e.target,async()=>{const v=k=>$('#a'+k).value.trim(),s=+v('s');
    if(!v('i')||!v('l')||!v('m')||!v('r'))return $('#e').textContent='أكمل بيانات الهوية والرخصة والمركبة.';
    if(!(s>=1&&s<=8))return $('#e').textContent='عدد المقاعد بين 1 و8.';
    const docs={};for(const [k,id] of [['id','fid'],['license','fl'],['car','fc']]){const f=$('#'+id).files[0];if(!f)return $('#e').textContent='ارفع صور الوثائق الثلاث.';const path=U.id+'/'+k+'-'+Date.now()+'.jpg';const up=await sb.storage.from('driver-docs').upload(path,f,{upsert:true,contentType:f.type||'image/jpeg'});if(up.error)return err(up.error);docs[k]=path}
    const {error}=await sb.rpc('apply_as_driver',{p_id_number:v('i'),p_license:v('l'),p_model:v('m'),p_color:v('c'),p_plate:v('r'),p_seats:s,p_docs:docs,p_ccp:v('k')});
    if(error)return err(error);toast('تم إرسال طلبك للإدارة');await load();vAcct()})}

async function vTrips(){const a=await sb.from('trips').select('*,trip_stops(name,seq)').eq('driver_id',U.id).order('departs_at',{ascending:false}).limit(20),r=await sb.rpc('driver_open_requests');if(a.error)return err(a.error);

class="row"><div style="flex:1"><label>التاريخ</label><input id="d" type="date" value="${tomorrow()}"></div><div style="flex:1"><label>الساعة</label><input id="h" type="time" value="08:00"></div></div><div class="row"><div style="flex:1"><label>المقاعد</label><input id="n" type="number" min="1" max="8" value="${DRV?DRV.seats:4}"></div><div style="flex:1"><label>سعر المقعد لك (دج)</label><input id="pr" type="number"></div></div><div class="err" id="e"></div><button class="btn" id="go">نشر الرحلة</button></details>`);
  $('#av').onclick=e=>busy(e.target,async()=>{const {error}=await sb.rpc('set_available',{p_on:!av});if(error)return err(error);await load();vTrips()});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=reqs[b.dataset.g];
    $('#acc').innerHTML=`<div class="card"><b>قبول: ${esc(g.from)} ← ${esc(g.to)} (${esc(g.date)})</b><p class="note">بعد القبول تصير الرحلة رسمية ويُشعَر الركاب ليدفعوا ويثبّتوا مقاعدهم، وتظهر لمن يبحث عن وجهة قريبة.</p><div class="row"><div style="flex:1"><label>ساعة الانطلاق</label><input id="at" type="time" value="08:00"></div><div style="flex:1"><label>سعر المقعد لك (دج)</label><input id="ap" type="number" placeholder="1500"></div></div><label>نقطة التجمع</label><input id="am"><label>محطات الطريق (اختياري، مفصولة بفاصلة)</label><input id="as"><div class="err" id="ae"></div><button class="btn" id="ok">تأكيد وجعل الرحلة رسمية</button></div>`;
    $('#acc').scrollIntoView({behavior:'smooth'});
    $('#ok').onclick=e=>busy(e.target,async()=>{const pr=+$('#ap').value,tm=$('#at').value;if(!tm||!(pr>=100))return $('#ae').textContent='أدخل الساعة وسعراً صحيحاً.';
      const stops=$('#as').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
      const x=await sb.rpc('accept_requests',{p_from:g.from,p_to:g.to,p_date:g.date,p_time:tm,p_price:pr,p_meeting:$('#am').value.trim()||null,p_stops:stops});if(x.error)return err(x.error);
      toast('أصبحت الرحلة رسمية. ركاب: '+x.data.people);vTrips()})});
  $('#go').onclick=e=>busy(e.target,async()=>{const v=k=>$('#'+k).value.trim(),E=$('#e');
    if(!v('f')||!v('t')||v('f')===v('t'))return E.textContent='حدّد انطلاقاً ووجهة مختلفين.';
    if(!(+v('pr')>=100))return E.textContent='أدخل سعراً صحيحاً.';
    const dep=new Date(v('d')+'T'+v('h')+':00+01:00');if(isNaN(dep)||dep<new Date())return E.textContent='اختر موعداً في المستقبل.';
    const {data:t,error}=await sb.from('trips').insert({driver_id:U.id,from_wilaya:v('f'),to_wilaya:v('t'),meeting_point:v('mp')||null,departs_at:dep.toISOString(),seats_total:+v('n'),driver_price:+v('pr')}).select().single();
    if(error)return err(error);
    const stops=v('st').split(/[,،]/).map(s=>s.trim()).filter(Boolean);
    if(stops.length){const q=await sb.from('trip_stops').insert(stops.map((name,i)=>({trip_id:t.id,seq:i+1,name})));if(q.error)return err(q.error)}
    toast('تم نشر الرحلة');vTrips()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>busy(b,async()=>{const {error}=await sb.rpc('set_trip_status',{p_trip:b.dataset.id,p_status:b.dataset.a});if(error)return err(error);vTrips()}));
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>busy(b,async()=>{const {data,error}=await sb.rpc('trip_passengers',{p_trip:b.dataset.p});if(error)return err(error);$('#pp'+b.dataset.p).innerHTML=data.length?data.map(x=>`<div class="note">• ${esc(x.name)} · ${x.seats} مقعد · نزول: ${esc(x.drop_off)} · <span dir="ltr">${esc(x.phone||'')}</span></div>`).join(''):'<div class="note">لا ركاب بعد.</div>'}));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>busy(b,async()=>{const {data,error}=await sb.rpc('create_transfer',{p_trip:b.dataset.x});if(error)return err(error);$('#pp'+b.dataset.x).innerHTML=`<div class="res ok">رمز التحويل: <b dir="ltr">${esc(data)}</b><br>أعطه للسائق الآخر خلال 30 دقيقة.</div>`}));
  $('#tka').onclick=e=>busy(e.target,async()=>{const {data,error}=await sb.rpc('accept_transfer',{p_token:$('#tk').value});if(error)return err(error);toast(data.result==='accepted'?'أصبحت الرحلة لك':'بانتظار موافقة الإدارة');vTrips()})}

async function camScan(done){if(!('BarcodeDetector' in window))return toast('الكاميرا غير مدعومة في هذا المتصفح. أدخل الرمز يدوياً.');
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('لم يُسمح بالكاميرا.')}
  const v=document.createElement('video');v.srcObject=st;v.setAttribute('playsinline','');v.style.cssText='width:100%;border-radius:12px;margin-top:8px';$('#cam').appendChild(v);await v.play();
  const det=new BarcodeDetector({formats:['qr_code']});let on=true;const stop=()=>{on=false;st.getTracks().forEach(t=>t.stop());v.remove()};
  const loop=async()=>{if(!on)return;try{const r=await det.detect(v);if(r.length){stop();done(r[0].rawValue);return}}catch(e){}setTimeout(loop,300)};loop()}
function vScan(){V('<h2>مسح التذاكر</h2><p class="sub">امسح رمز QR بالكاميرا أو أدخل رمز التذكرة (TB-…).</p><div class="card"><input id="c" dir="ltr" placeholder="TB-XXXXXXXXXX"><button class="btn" id="go">تحقق</button><button class="btn ghost" id="cm">📷 مسح بالكاميرا</button><div id="cam"></div><div id="r"></div></div>');$('#cm').onclick=()=>camScan(c=>{$('#c').value=c;$('#go').click()});
  $('#go').onclick=e=>busy(e.target,async()=>{const {data,error}=await sb.rpc('scan_ticket',{p_code:$('#c').value});if(error)return err(error);
    const ok=data.result==='valid',R=$('#r');
    R.innerHTML=data.result==='invalid'?'<div class="res bad">✗ تذكرة غير صالحة</div>':`<div class="res ${ok?'ok':'bad'}">${ok?'✓ تذكرة صالحة':'✗ استُعملت من قبل ('+fmt(data.used_at)+')'}<br>الراكب: ${esc(data.passenger)}<br>${esc(data.route)} · نزول: ${esc(data.drop_off)}<br>${fmt(data.departs)} · ${data.seats} مقعد</div>`})}

  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>busy(b,async()=>{const ok=b.dataset.ok==='1';const why=ok?null:(prompt('سبب الرفض؟','وثائق غير كاملة')||'وثائق غير كاملة');

async function vDues(){const {data,error}=await sb.rpc('admin_driver_dues');if(error)return err(error);
  V('<h2>مستحقات السائقين</h2><p class="sub">رحلات انتهت ومرّت مدة التعليق وبلا شكوى مفتوحة. تحويل المال يتم خارج التطبيق، ثم تسجّله هنا.</p>'+(data.length?data.map((d,i)=>`<div class="card"><div class="row"><b>${esc(d.driver_name)}</b><b class="price">${d.amount} دج</b></div><div class="note">${d.n_bookings} حجز · CCP: <b dir="ltr">${esc(d.ccp||'—')}</b></div><button class="btn sm" data-i="${i}">سجّلت التحويل</button></div>`).join(''):'<p class="sub">لا توجد مستحقات جاهزة.</p>'));
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>busy(b,async()=>{if(!confirm('هل حوّلت المبلغ فعلاً؟'))return;const {error}=await sb.rpc('admin_pay_driver',{p_driver:data[b.dataset.i].due_driver,p_note:null});if(error)return err(error);toast('تم التسجيل');vDues()}))}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')boot()});
boot();
</script>
</body>
</html>
